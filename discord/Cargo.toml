
# workspace = { members = ["discord_macro"] }
[package]
name = "discord"
version = "0.1.0"
edition = "2021"
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
discord_macro = { path = "./discord_macro" }
websocket_message_macro = { path = "./websocket_message_macro" }

serde_json = "1.0.100"
serde_repr = "0.1.14"
serde_with = "3.9"
serde = { version = "1.0.167", features = ["derive"] }
#serde_test = "1"

thiserror = "1"
reqwest = { version = "0.12", features = [ "json" ] }

chrono = "0.4"

tokio-tungstenite = { version = "0.21.0", features = [
    "rustls-tls-webpki-roots",
] }

anyhow = "1.0.79"
#Logging📋
log = { version = "0.4.19", features = ["max_level_debug"] }
# Async functionality 🗼
tokio = { version = "1.32.0", features = ["full"] }
futures-util = "0.3.28"
async-trait = "0.1.73"

flate2 = { version = "1.0.26" } #stream compression/decompression
# Crypto 🐕‍🦺coin
rsa = "0.9.2"
rand = "0.8.5"
sha2 = "0.10"
base64 = "0.22"
base16 = "0.2"

[dev-dependencies]
tokio-test = "0.4.4"
reqwest = { version = "0.12", features = [ "json" ] }
dotenv = "0.15.0"

[profile.dev.package.num-bigint-dig]
opt-level = 3 #speeds up RSA key generation
