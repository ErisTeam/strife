
[package]
name = "discord"
version = "0.1.0"
edition = "2021"
authors.workspace = true

[dependencies]
websocket_strife = { path = "../websocket_strife" }

serde_json = "1.0.100"
serde_repr = "0.1.14"
serde = { version = "1.0.167", features = ["derive"] }

tokio-tungstenite = { version = "0.21.0", features = [
    "rustls-tls-webpki-roots",
] }

anyhow = "1.0.79"
#Logging📋
log = { version = "0.4.19", features = ["max_level_debug"] }
# Async functionality 🗼
tokio = { version = "1.32.0", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3.28"
async-trait = "0.1.73"

flate2 = { version = "1.0.26" } #stream compression/decompression
# Crypto 🐕‍🦺coin
rsa = "0.9.2"
rand = "0.8.5"
sha2 = "0.10"
base64 = "0.22"

tokio-rustls = { version = "0.26", features = [
    "logging",
    "tls12",
    "ring",
], default-features = false }
webpki-roots = "0.26"
hyper-util = "0.1"
hyper = { version = '1.4', features = ["http1", "client"] }
http-body-util = "0.1"

[dev-dependencies]
tokio-test = "0.4.4"

[profile.dev.package.num-bigint-dig]
opt-level = 3 #speeds up RSA key generation
